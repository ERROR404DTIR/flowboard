<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><meta name="description" content="A visual flowchart maker with draggable nodes, connections, Mermaid export and JSON backup."><title>FlowBoard</title><style>body{margin:0;background:#0b1020;color:#edf2ff;font:15px system-ui}main{max-width:1050px;margin:auto;padding:25px 18px}header{color:#a5b4fc;display:flex;justify-content:space-between;font-weight:800}.hero{padding:28px 0}.hero h1{font-size:40px}.muted,small{color:#9aa8c3}.layout{display:grid;grid-template-columns:250px 1fr;gap:14px}.panel{background:#151e31;border:1px solid #30405a;border-radius:15px;padding:16px}.stack{display:grid;gap:11px}button,input,select,textarea{font:inherit}button{background:#a5b4fc;color:#111827;border:0;border-radius:9px;padding:10px;cursor:pointer;font-weight:700}button.secondary{background:#30405a;color:white}input,select,textarea{background:#0e1729;color:white;border:1px solid #394a65;border-radius:8px;padding:10px;width:100%;box-sizing:border-box}label{display:grid;gap:5px;color:#b4c0d4;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.item{border:1px solid #394a65;padding:10px;border-radius:9px;margin:7px 0}footer{text-align:center;color:#8997b0;padding:25px}@media(max-width:700px){.layout{grid-template-columns:1fr}.hero h1{font-size:33px}}</style></head><body><main><header><span>ERROR404DTIR / OPEN SOURCE</span><small>LOCAL · FREE · NO BUILD</small></header><section class="hero"><small>SMALL TOOL / BIG UTILITY</small><h1>FlowBoard</h1><p class="muted">A visual flowchart maker with draggable nodes, connections, Mermaid export and JSON backup.</p></section><div><button data-add="Start">+ Start</button> <button data-add="Step">+ Step</button> <button data-add="Decision">+ Decision</button> <button data-add="End">+ End</button></div><label>Selected node label<input id="label"></label><button id="rename">Rename</button><button id="connect">Connect selected nodes</button><button id="mermaid">Export Mermaid</button><button id="json">Export JSON</button><div id="board" style="position:relative;min-height:560px;background:radial-gradient(#52617b 1px,transparent 1px) 0 0/20px 20px;overflow:hidden"><svg id="edges" style="position:absolute;width:100%;height:100%;pointer-events:none"></svg><div id="nodes"></div></div><footer>Runs locally in your browser · No account required</footer></main><script>const $=x=>document.getElementById(x);let ns=[],es=[],sel=[],drag=null;function add(t){ns.push({id:ns.length+1,t,label:t,x:20+ns.length%3*165,y:25+Math.floor(ns.length/3)*100});draw()}function draw(){$('nodes').innerHTML=ns.map(n=>'<div data-id="'+n.id+'" style="position:absolute;left:'+n.x+'px;top:'+n.y+'px;width:130px;padding:14px;background:'+(sel.includes(n.id)?'#526d9d':'#263651')+';border:1px solid #9ab0d7;border-radius:9px;cursor:move">'+n.t+'<br>'+n.label+'</div>').join('');$('edges').innerHTML=es.map(e=>{let a=ns.find(n=>n.id===e[0]),b=ns.find(n=>n.id===e[1]);return a&&b?'<path d="M'+(a.x+65)+' '+(a.y+55)+' L'+(b.x+65)+' '+b.y+'" stroke="#a5b4fc" stroke-width="2"/>':''}).join('')}document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));$('nodes').onpointerdown=e=>{let el=e.target.closest('[data-id]');if(!el)return;let id=+el.dataset.id,r=$('board').getBoundingClientRect(),n=ns.find(n=>n.id===id);sel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id].slice(-2);drag={id,dx:e.clientX-r.left-n.x,dy:e.clientY-r.top-n.y};$('label').value=n.label;draw()};onpointermove=e=>{if(!drag)return;let n=ns.find(n=>n.id===drag.id),r=$('board').getBoundingClientRect();n.x=e.clientX-r.left-drag.dx;n.y=e.clientY-r.top-drag.dy;draw()};onpointerup=()=>drag=null;$('rename').onclick=()=>{let n=ns.find(n=>n.id===sel.at(-1));if(n){n.label=$('label').value;draw()}};$('connect').onclick=()=>{if(sel.length===2){es.push(sel.slice());sel=[];draw()}};function dl(n,s){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([s]));a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}$('mermaid').onclick=()=>dl('flowchart.mmd','flowchart TD\n'+ns.map(n=>'N'+n.id+'['+n.label+']').join('\n')+'\n'+es.map(e=>'N'+e[0]+' --> N'+e[1]).join('\n'));$('json').onclick=()=>dl('flowboard.json',JSON.stringify({nodes:ns,edges:es},null,2));add('Start');add('Step');add('End');</script></body></html>
